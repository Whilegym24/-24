# Supabase 무료 프로젝트가 7일간 조용해서 자동 정지되지 않도록, 매일 가벼운 조회 요청을 몇 번 보냅니다.
name: keepalive

on:
  schedule:
    - cron: '0 6 * * *'      # 매일 15:00(한국 시간)쯤
  workflow_dispatch:          # Actions 탭에서 직접 눌러 시험할 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase 깨우기
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null -w "요청 $i: %{http_code}\n" \
              "https://arhljhcixqlohlatgniq.supabase.co/rest/v1/reservations?select=id&limit=1" \
              -H "apikey: sb_publishable_-Wx2NvdmLvcSEw1XSxgFUg_yDnS40Nc"
            sleep 2
          done
